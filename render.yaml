services:
  - type: web
    name: landlord-maintenance-api
    runtime: node
    plan: free
    rootDir: server
    # Not `npm ci`: the Mac-generated lockfile omits Linux-only optional packages that jest (dev-only) pulls in.
    buildCommand: npm install --omit=dev && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon Postgres (free, doesn't expire like Render's free database). Set in the Render dashboard;
      # use the direct (non-pooled) connection string so migrations work.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel URL, e.g. https://landlord-maintenance.vercel.app — Render asks for it on setup.
      - key: CLIENT_ORIGIN
        sync: false
