name: Keep API awake

# Render's free plan puts the API to sleep after ~15 idle minutes, and waking it takes up to a
# minute: long enough for a visitor to give up. Pinging every 10 minutes keeps it warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://landlord-maintenance-api.onrender.com/api/health
