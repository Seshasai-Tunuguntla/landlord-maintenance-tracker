databases:
  - name: landlord-maintenance-db
    plan: free
    databaseName: landlord_maintenance
    user: landlord

services:
  - type: web
    name: landlord-maintenance-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: landlord-maintenance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel URL, e.g. https://landlord-maintenance.vercel.app — Render asks for it on setup.
      - key: CLIENT_ORIGIN
        sync: false
